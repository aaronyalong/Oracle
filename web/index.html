<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oracle</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #656d76; --border: #d8dee4;
    --accent: #6d4aff; --accent-soft: #efeaff; --warn-bg: #fff5d6; --warn-text: #7a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f23; --text: #e6e6e6; --muted: #9a9aa3; --border: #34343a;
      --accent: #a48bff; --accent-soft: #2b2540; --warn-bg: #3a3120; --warn-text: #f0cf7a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; }
  #status { color: var(--muted); font-size: 13px; flex: 1; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel);
           color: var(--text); border-radius: 8px; padding: 6px 12px; }
  button:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 4px; margin: 20px 0 10px; }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 8px;
          border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 2px 0; }
  #answer { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--border);
            border-radius: 10px; padding: 14px 16px; margin-top: 16px; }
  #answer:empty { display: none; }
  .cite { display: inline-block; font-size: 12px; padding: 0 5px; margin: 0 1px; border-radius: 5px;
          background: var(--accent-soft); color: var(--accent); text-decoration: none; vertical-align: 1px; }
  .warning { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px;
             padding: 8px 12px; margin-top: 10px; font-size: 14px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  ol.results { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
  ol.results li { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  ol.results li.cited { border-color: var(--accent); }
  .result-title { font-weight: 600; color: var(--text); text-decoration: none; }
  .result-title:hover { text-decoration: underline; }
  .heading { color: var(--muted); font-weight: 400; }
  .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px;
           padding: 0 4px; margin-left: 6px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 4px; }
  details pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; margin: 6px 0 0; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Oracle</h1>
    <span id="status">Connecting…</span>
    <button id="reindex" type="button" title="Re-embed notes that changed">Re-index</button>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-mode="ask">Ask</button>
    <button role="tab" aria-selected="false" data-mode="search">Search</button>
  </div>

  <form id="form">
    <input id="query" autocomplete="off" autofocus placeholder="Ask a question about your notes…">
    <button id="go" type="submit">Ask</button>
  </form>
  <p class="hint" id="hint">Answers come only from your notes, with numbered sources. Runs locally.</p>

  <section id="ask-view">
    <div id="answer"></div>
    <div id="warning" class="warning" hidden></div>
    <div id="ask-meta" class="meta" hidden></div>
    <ol id="sources" class="results"></ol>
  </section>

  <section id="search-view" hidden>
    <div id="search-meta" class="meta" hidden></div>
    <ol id="results" class="results"></ol>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let mode = "ask";
let source = null;       // the open EventSource while an answer streams
let searchTimer = null;

// --- Small DOM helpers (textContent only, so note text is never interpreted as HTML) ---

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

// Answer text -> text with **bold** and clickable [n] citations.
function renderAnswer(text, sourceCount) {
  const out = document.createDocumentFragment();
  for (const part of text.split(/(\[\d+\]|\*\*[^*]+\*\*)/)) {
    const cite = part.match(/^\[(\d+)\]$/);
    if (cite && +cite[1] >= 1 && +cite[1] <= sourceCount) {
      out.append(el("a", { className: "cite", href: `#source-${cite[1]}`, textContent: cite[1] }));
    } else if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
      out.append(el("strong", { textContent: part.slice(2, -2) }));
    } else {
      out.append(part);
    }
  }
  return out;
}

function resultItem(hit, { number, cited } = {}) {
  const title = el("a", { className: "result-title", href: hit.url, title: "Open in Obsidian" },
    number ? `[${number}] ` : "", hit.title,
    hit.heading ? el("span", { className: "heading", textContent: ` › ${hit.heading}` }) : "");
  const badge = el("span", { className: "badge", textContent: hit.via });
  const excerpt = el("details", {}, el("summary", { textContent: "Show excerpt" }),
                     el("pre", { textContent: hit.text }));
  return el("li", { id: number ? `source-${number}` : "", className: cited ? "cited" : "" }, title, badge, excerpt);
}

// --- Ask: stream the answer with Server-Sent Events ---

function ask(question) {
  if (source) source.close();
  $("answer").textContent = "";
  $("sources").replaceChildren();
  $("warning").hidden = true;
  $("ask-meta").hidden = false;
  $("ask-meta").textContent = "Searching your notes and writing an answer…";
  $("go").disabled = true;
  const started = performance.now();

  source = new EventSource(`/api/ask?q=${encodeURIComponent(question)}`);
  source.addEventListener("token", (e) => { $("answer").append(JSON.parse(e.data)); });
  source.addEventListener("done", (e) => {
    source.close();
    source = null;
    $("go").disabled = false;
    const result = JSON.parse(e.data);
    $("answer").replaceChildren(renderAnswer(result.text, result.sources.length));
    result.sources.forEach((hit, i) =>
      $("sources").append(resultItem(hit, { number: i + 1, cited: result.cited.includes(i + 1) })));
    if (result.unsupported.length) {
      $("warning").hidden = false;
      $("warning").textContent = "⚠ Not found in your notes (may come from the model's own knowledge): "
        + result.unsupported.join(", ");
    }
    const seconds = ((performance.now() - started) / 1000).toFixed(1);
    $("ask-meta").textContent = `${seconds}s · ${result.cited.length} of ${result.sources.length} sources cited`;
  });
  source.onerror = () => {
    if (!source) return;  // already finished
    source.close();
    source = null;
    $("go").disabled = false;
    $("ask-meta").textContent = "Lost connection to the Oracle server. Is it still running?";
  };
}

// --- Search: instant hybrid results, no LLM ---

async function search(query) {
  const started = performance.now();
  const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
  if (!response.ok) return;
  const { results } = await response.json();
  if ($("query").value.trim() !== query) return;  // a newer search is on its way
  $("results").replaceChildren(...results.map((hit) => resultItem(hit)));
  $("search-meta").hidden = false;
  $("search-meta").textContent = `${results.length} results · ${Math.round(performance.now() - started)} ms`;
}

// --- Wiring ---

function setMode(next) {
  mode = next;
  document.querySelectorAll("[role=tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.mode === mode));
  $("ask-view").hidden = mode !== "ask";
  $("search-view").hidden = mode !== "search";
  $("go").textContent = mode === "ask" ? "Ask" : "Search";
  $("query").placeholder = mode === "ask" ? "Ask a question about your notes…" : "Search by meaning and keywords…";
  $("hint").textContent = mode === "ask"
    ? "Answers come only from your notes, with numbered sources. Runs locally."
    : "Ranked sections from your notes, instantly. Click a title to open it in Obsidian.";
  $("query").focus();
}

document.querySelectorAll("[role=tab]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("query").value.trim();
  if (!q) return;
  mode === "ask" ? ask(q) : search(q);
});

$("query").addEventListener("input", () => {
  if (mode !== "search") return;
  clearTimeout(searchTimer);
  const q = $("query").value.trim();
  if (q) searchTimer = setTimeout(() => search(q), 250);
});

async function refreshStatus() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("status").textContent = `${h.vault} · ${h.chunks} chunks · ${h.llm_model}`;
  } catch {
    $("status").textContent = "Server not reachable";
  }
}

$("reindex").addEventListener("click", async () => {
  $("reindex").disabled = true;
  $("status").textContent = "Re-indexing…";
  try {
    const r = await (await fetch("/api/index", { method: "POST" })).json();
    await refreshStatus();
    $("status").textContent += ` · ${r.updated} notes updated`;
  } catch {
    $("status").textContent = "Re-index failed";
  }
  $("reindex").disabled = false;
});

refreshStatus();
</script>
</body>
</html>
